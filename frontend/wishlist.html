<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Wishlist – SHOP EASE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('shopease-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Stagger Fade */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-enter { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }

    /* Remove Collapse */
    .removing { transform: scale(0.9); opacity: 0; transition: all 0.3s ease-in-out; }
  </style>
  <script src="/static/common.js?v=1.6" defer></script>
</head>
<body class="bg-primary text-primary font-sans h-screen overflow-hidden flex flex-col md:flex-row transition-colors duration-300">

  <!-- Left Brand Panel -->
  <div class="hidden md:flex md:w-2/5 relative overflow-hidden flex-col justify-between p-12 lg:p-20 text-white" style="background: var(--nav-bg);">
    <!-- Floating Orbs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
      <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-white/[0.03] rounded-full blur-3xl animate-[spin_20s_linear_infinite]"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[30vw] h-[30vw] bg-yellow-400/[0.05] rounded-full blur-3xl animate-[pulse_10s_ease-in-out_infinite]"></div>
    </div>

    <!-- Header -->
    <div class="relative z-10 animate-[fadeUp_0.8s_ease-out_forwards]">
      <a href="index.html" class="text-3xl font-black tracking-tight hero-title hover:text-gray-300 transition-colors" style="color: var(--text-primary)">SHOP EASE</a>
    </div>

    <!-- Center Headline & Perks -->
    <div class="relative z-10 animate-[fadeUp_0.8s_ease-out_0.2s_forwards] opacity-0">
      <h1 class="text-5xl lg:text-6xl font-extrabold leading-[1.1] mb-6 hero-title tracking-tight uppercase" style="color: var(--text-primary)">
        Your Curated <br><span class="text-yellow-400 italic font-medium">Wishlist.</span>
      </h1>
      <p class="text-lg mb-12 max-w-md leading-relaxed" style="color: var(--text-secondary)">
        Review the pieces you love, track their availability, and move them to your cart when you're ready to checkout.
      </p>

      <!-- Stats / Pills -->
      <div class="flex flex-wrap gap-4 mt-8">
        <div class="px-5 py-2.5 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm flex items-center gap-2 text-sm font-bold shadow-lg">
          <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Saved Forever
        </div>
        <div class="px-5 py-2.5 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm flex items-center gap-2 text-sm font-bold shadow-lg">
          <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Fast Checkout
        </div>
      </div>
    </div>
  </div>

  <!-- Right Content Panel -->
  <div class="w-full md:w-3/5 h-full overflow-y-auto flex flex-col scrollbar-hide relative pb-20" style="background: var(--bg-primary); color: var(--text-primary);">
    
    <!-- Navbar inside right panel -->
    <div class="sticky top-0 z-40 glass border-b px-6 lg:px-12 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold hero-title tracking-widest md:hidden" style="color: var(--text-primary)">SHOP EASE</a>
      <h2 class="text-xl font-bold hero-title tracking-widest hidden md:block" style="color: var(--text-primary)">MY WISHLIST</h2>
      
      <div class="flex items-center gap-6">
        <a href="index.html" class="text-sm font-bold transition-colors" style="color: var(--text-secondary); hover: color: var(--text-primary)">Home</a>
        <a href="cart.html" class="relative group flex items-center gap-2" style="color: var(--text-primary)">
          <span class="text-sm font-bold hidden sm:block">Cart</span>
          <div class="relative">
            <svg class="w-6 h-6 group-hover:scale-110 transition-transform" id="navCartIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
            <span id="cartBadge" class="absolute -top-2 -right-2 text-white text-[10px] font-bold h-4 min-w-[16px] flex items-center justify-center rounded-full px-1 shadow-sm" style="background: var(--text-primary); color: var(--bg-primary)">0</span>
          </div>
        </a>
      </div>
    </div>

    <!-- Wishlist Grid -->
    <div class="p-6 lg:p-12 flex-1">
      <div class="md:hidden mb-8 animate-[fadeUp_0.6s_ease-out_forwards]">
        <h1 class="text-4xl font-extrabold hero-title tracking-tight">Your Wishlist</h1>
        <p class="text-gray-500 text-sm mt-2">Items you love, saved for later.</p>
      </div>

      <div id="wishlistGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Loading State -->
        <div class="col-span-full flex flex-col items-center justify-center py-20 animate-[fadeUp_0.6s_ease-out_forwards]">
          <div class="w-10 h-10 border-4 rounded-full animate-spin mb-4" style="border-color: var(--bg-secondary); border-top-color: var(--text-primary)"></div>
          <p class="font-medium" style="color: var(--text-secondary)">Loading your items...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    async function loadFullWishlist() {
      const grid = document.getElementById('wishlistGrid');
      
      try {
        const response = await apiRequest('/wishlist');
        
        if (response.status === 401) {
          grid.innerHTML = `
            <div class="col-span-full flex flex-col items-center justify-center py-24 rounded-2xl border shadow-sm animate-[fadeUp_0.6s_ease-out_forwards]" style="background: var(--bg-secondary); border-color: var(--border-color)">
              <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4" style="background: var(--bg-primary)">
                <svg class="w-8 h-8" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              </div>
              <h3 class="text-xl font-bold mb-2">Sign in to view</h3>
              <p class="mb-6 text-center max-w-sm" style="color: var(--text-secondary)">Please log in to your account to view and manage your saved items.</p>
              <a href="login.html" class="px-8 py-3 rounded-xl font-bold hover:-translate-y-0.5 hover:shadow-lg transition-all" style="background: var(--text-primary); color: var(--bg-primary)">Sign In</a>
            </div>
          `;
          return;
        }

        if (!response.ok) throw new Error("Failed to fetch");
        
        const responseData = await response.json();
        const products = responseData.data || responseData;
        
        if (products.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full flex flex-col items-center justify-center py-24 rounded-2xl border shadow-sm animate-[fadeUp_0.6s_ease-out_forwards]" style="background: var(--bg-secondary); border-color: var(--border-color)">
              <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4" style="background: var(--bg-primary)">
                <svg class="w-8 h-8" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              </div>
              <h3 class="text-xl font-bold mb-2">Your wishlist is empty</h3>
              <p class="mb-6 text-center max-w-sm" style="color: var(--text-secondary)">Explore our collections and save your favorite pieces for later.</p>
              <a href="index.html" class="px-8 py-3 rounded-xl font-bold hover:-translate-y-0.5 hover:shadow-lg transition-all" style="background: var(--text-primary); color: var(--bg-primary)">Explore Products</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = products.map((p, index) => {
          const safeName = escapeHtml(p.name);
          const safePrice = escapeHtml(p.price);
          const safeImg = escapeHtml(p.image);
          const delay = index * 0.1;
          
          return `
            <div class="rounded-2xl p-4 shadow-sm border transition-all duration-300 relative group flex flex-col card-enter" style="background: var(--bg-secondary); border-color: var(--border-color); animation-delay: ${delay}s">
              <!-- Remove Button -->
              <button onclick="removeFromFullWishlist('${p.id}', this)" 
                class="absolute top-6 right-6 z-20 w-8 h-8 rounded-full shadow-sm flex items-center justify-center transition-all transform hover:scale-110" style="background: var(--bg-primary); color: var(--text-secondary)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
              
              <!-- Image -->
              <div class="w-full aspect-[4/5] rounded-xl overflow-hidden cursor-pointer mb-4" onclick="window.location.href='product-detail.html?name=${encodeURIComponent(p.name)}'" style="background: var(--bg-primary)">
                <img src="${safeImg}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" alt="${safeName}" />
              </div>
              
              <!-- Content -->
              <div class="flex flex-col flex-1">
                <h3 class="font-bold text-sm mb-1 line-clamp-1 cursor-pointer hover:underline" onclick="window.location.href='product-detail.html?name=${encodeURIComponent(p.name)}'">${safeName}</h3>
                <p class="font-black text-lg mb-4">$${safePrice}</p>
                
                <div class="mt-auto">
                  <button onclick="addToCartFromWishlist(this)" 
                    data-id="${p.id}" data-name="${safeName}" data-price="${safePrice}" data-img="${safeImg}"
                    class="w-full py-3 rounded-xl font-bold transition-colors flex items-center justify-center gap-2" style="background: var(--bg-primary); color: var(--text-primary)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                    Move to Cart
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center py-10"><p class="text-red-500 font-medium">Unable to load your wishlist. Please refresh the page.</p></div>`;
      }
    }

    async function removeFromFullWishlist(productId, btn) {
      try {
        const response = await apiRequest('/wishlist/toggle', {
          method: 'POST',
          body: JSON.stringify({ product_id: productId })
        });
        
        if (response.ok) {
          const card = btn.closest('.card-enter');
          card.classList.add('removing');
          
          setTimeout(() => {
            card.remove();
            if (document.getElementById('wishlistGrid').children.length === 0) {
              loadFullWishlist(); // Refresh to show empty state
            }
          }, 300);

          // Update local storage
          const userStr = localStorage.getItem('user');
          if(userStr) {
            const user = JSON.parse(userStr);
            if(user.wishlist) {
              user.wishlist = user.wishlist.filter(id => parseInt(id) !== parseInt(productId));
              localStorage.setItem('user', JSON.stringify(user));
            }
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    function addToCartFromWishlist(btn) {
      addToCart(btn);
      
      // Flash Cart Icon Animation
      const cartIcon = document.getElementById('navCartIcon');
      const originalPath = cartIcon.innerHTML;
      cartIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />';
      cartIcon.classList.add('text-green-500', 'scale-125');
      
      setTimeout(() => {
        cartIcon.innerHTML = originalPath;
        cartIcon.classList.remove('text-green-500', 'scale-125');
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFullWishlist();
      if(typeof updateCartBadge === 'function') updateCartBadge();
    });

    document.addEventListener('cart:updated', () => {
      const badge = document.getElementById("cartBadge");
      if (badge && window.cartStore) badge.innerText = cartStore.totalItems;
    });
  </script>
</body>
</html>
