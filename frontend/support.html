<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support — SHOP EASE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('shopease-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .hero-title { font-family: 'Syne', sans-serif; }
    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 2rem;
      padding: 40px;
      height: 100%;
      transition: all 0.3s ease;
    }
    .contact-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }
    .support-form-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 3rem;
      padding: 4rem;
      box-shadow: 0 20px 50px var(--shadow);
    }
    input, textarea {
      background: var(--bg-primary) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 1.25rem !important;
      padding: 16px 24px !important;
      width: 100%;
      outline: none;
      transition: all 0.3s ease;
      color: var(--text-primary) !important;
    }
    input:focus, textarea:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
    }
    .btn-support-send {
      background: var(--text-primary);
      color: var(--bg-primary);
      width: 100%;
      padding: 18px;
      border-radius: 1.25rem;
      font-weight: 700;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .btn-support-send:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 30px var(--shadow);
      opacity: 0.9;
    }
    [data-theme="dark"] .btn-support-send {
      background: #ffffff !important;
      color: #000000 !important;
    }
    [data-theme="dark"] .btn-support-send:hover {
      background: #f8fafc !important;
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>
  <script>
    fetch('nav.html').then(r => r.text()).then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;
    });
  </script>

  <main class="py-20 px-6 md:px-12 max-w-7xl mx-auto">
    <div class="text-center mb-20">
      <h1 class="hero-title text-6xl font-black mb-6">WE'RE HERE TO HELP</h1>
      <p class="text-gray-500 text-lg max-w-2xl mx-auto font-light">Have a question? Our support team is available 24/7 to assist you with your orders and styling needs.</p>
    </div>

    <div class="grid md:grid-cols-3 gap-8 mb-20">
      <div class="contact-card text-center">
        <div class="text-4xl mb-6">📧</div>
        <h3 class="text-xl font-bold mb-2">Email Us</h3>
        <p class="text-gray-500 mb-4 text-sm font-light">Response within 24 hours</p>
        <a href="mailto:support@shopease.com" class="text-black font-bold underline">support@shopease.com</a>
      </div>
      <div class="contact-card text-center">
        <div class="text-4xl mb-6">📞</div>
        <h3 class="text-xl font-bold mb-2">Call Us</h3>
        <p class="text-gray-500 mb-4 text-sm font-light">Mon-Fri, 9am - 6pm EST</p>
        <a href="tel:+18005550123" class="text-black font-bold underline">+1 (800) 555-0123</a>
      </div>
      <div class="contact-card text-center">
        <div class="text-4xl mb-6">💬</div>
        <h3 class="text-xl font-bold mb-2">Live Chat</h3>
        <p class="text-gray-500 mb-4 text-sm font-light">Instant support on our site</p>
        <button class="text-black font-bold underline">Start Chat</button>
      </div>
    </div>

    <div class="max-w-4xl mx-auto support-form-container">
      <h2 class="text-3xl font-black mb-10 text-center uppercase tracking-widest">Send Us a Message</h2>
      <form class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
        </div>
        <input type="text" placeholder="Order Number (Optional)">
        <textarea placeholder="How can we help?" rows="5" required></textarea>
        <button type="submit" class="btn-support-send">Send Message</button>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script>
    fetch('footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
    });
  </script>
  <script src="/static/common.js" defer></script>
</body>
</html>
