<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Orders – SHOP EASE</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">

  
  


  <!-- Resource Hints -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="dns-prefetch" href="https://ecommerce-website-shopease.vercel.app">

  <script src="https://cdn.tailwindcss.com" defer></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('shopease-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <script>
    window.addEventListener('load', () => {
      if (window.tailwind) {
        window.tailwind.config = {
          theme: { extend: { colors: { clifford: '#da373d' } } }
        }
      }
    });
  </script>
  <script src="/static/common.js?v=1.6" defer></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('shopease-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* Custom Fonts & Base overrides */
    body { font-family: 'Outfit', sans-serif; background-color: #fafafa; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .brand-bar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; }
    
    /* Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: inline-flex; animation: marquee 35s linear infinite; }
    
    /* Smooth Transitions */
    .page-transition { animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Glassmorphism utility */
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>

</head>

<body class="bg-[#F2F0F1] text-black">

  <!-- Shared Navigation Partial -->
  <div id="nav-placeholder"></div>
  <script>
    fetch('nav.html').then(r => r.text()).then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;
      if (typeof updateAuthUI === 'function') updateAuthUI();
      if (typeof updateCartBadge === 'function') updateCartBadge();
    });
  </script>


  <section class="py-12 px-6 md:px-12 max-w-4xl mx-auto min-h-screen">
    <h1 class="hero-title text-5xl font-black mb-8 tracking-wider">YOUR ORDERS</h1>

    <div id="ordersList" class="space-y-6">
      <!-- Orders will be loaded here -->
      <div class="bg-white p-12 rounded-3xl text-center shadow-sm">
        <p class="text-gray-500 italic">Loading your order history...</p>
      </div>
    </div>

  </section>

  <footer class="bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 py-12 px-6 md:px-12 mt-12">
    <div class="max-w-7xl mx-auto text-center">
      <h2 class="hero-title text-3xl font-black mb-4">SHOP EASE</h2>

      <div class="border-t border-gray-800 mt-10 pt-6 text-xs text-gray-500">
        © 2026 SHOP EASE. All Rights Reserved.
      </div>
    </div>
  </footer>

  <script>
    async function cancelOrder(orderId) {
      if (!confirm("Are you sure you want to permanently DELETE this order from your history?")) return;

      try {
        const response = await apiRequest(`/orders/${orderId}/cancel`, {
          method: 'PUT'
        });

        const data = await response.json();
        if (response.ok) {
          // Immediately remove the card with a smooth animation
          const card = document.getElementById(`order-${orderId}`);
          if (card) {
            card.style.transition = 'all 0.4s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
              card.remove();
              // Check if list is empty
              const list = document.getElementById('ordersList');
              if (list.children.length === 0) {
                loadOrders(); // Show empty state
              }
            }, 400);
          }
        } else {
          alert(data.message || "Failed to cancel order");
        }
      } catch (err) {
        alert("An error occurred. Please try again.");
      }
    }

    async function loadOrders() {
      const list = document.getElementById('ordersList');

      try {
        const response = await apiRequest('/orders');

        if (response.status === 401) {
          list.innerHTML = `
            <div class="bg-white p-12 rounded-3xl text-center shadow-sm">
              <p class="text-gray-500 mb-6">Please login to view your orders.</p>
              <a href="login.html" class="bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 px-8 py-3 rounded-full font-bold inline-block">Login Now</a>
            </div>
          `;
          return;
        }

        if (!response.ok) throw new Error("Failed to fetch");

        const responseData = await response.json();
        let orders = responseData.data || responseData;
        
        // Only show active orders (Pending/Shipped/Delivered)
        orders = orders.filter(o => (o.status || '').toLowerCase() !== 'cancelled');

        if (orders.length === 0) {
          list.innerHTML = `
            <div class="bg-white p-12 rounded-3xl text-center shadow-sm">
              <p class="text-gray-500 mb-6">You haven't placed any orders yet.</p>
              <a href="index.html" class="bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 px-8 py-3 rounded-full font-bold inline-block">Start Shopping</a>
            </div>
          `;
          return;
        }

        list.innerHTML = orders.map(order => {
          const dateObj = new Date(order.created_at);
          const date = dateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

          // Estimate delivery date (5 days after order)
          const deliveryDateObj = new Date(dateObj);
          deliveryDateObj.setDate(deliveryDateObj.getDate() + 5);
          const deliveryDate = deliveryDateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

          // Parse items if they are a string from the database
          let items = [];
          if (order.items) {
            try {
              items = typeof order.items === 'string' ? JSON.parse(order.items) : (order.items || []);
            } catch (e) {
              console.error("Order items parse error:", e);
              items = [];
            }
          }

          const status = order.status || 'Pending';
          const isCancelled = status.toLowerCase() === 'cancelled';
          const isPending = status.toLowerCase() === 'pending';
          const statusColor = isCancelled ? 'text-red-500' : (status === 'Delivered' ? 'text-green-600' : 'text-orange-500');

          // Map flat SQL columns to a shipping object for template compatibility
          const shipping = {
            name: escapeHtml(order.shipping_name),
            address: escapeHtml(order.shipping_address),
            phone: escapeHtml(order.shipping_phone),
            method: escapeHtml(order.shipping_method)
          };

          const safeTotal = escapeHtml(order.total);
          const safeOrderId = escapeHtml(order.id);
          const safeStatus = escapeHtml(status);

          return `
            <div id="order-${safeOrderId}" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden mb-8">
              <!-- Top Bar -->
              <div class="bg-gray-50 px-8 py-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-100 gap-2">
                <div class="flex items-center gap-4">
                  <span class="font-bold text-sm">Order #${safeOrderId}</span>
                  <span class="text-xs text-gray-400">${date}</span>
                </div>
                <div class="flex items-center gap-6">
                  <span class="text-xs font-bold ${statusColor}">
                    ${safeStatus.toUpperCase()}
                  </span>
                  ${isPending ? `
                    <button onclick="cancelOrder('${safeOrderId}')" class="text-[10px] font-bold text-red-500 hover:text-red-700 uppercase tracking-widest border-b border-red-200">
                      Cancel Order
                    </button>
                  ` : ''}
                </div>
              </div>

              <div class="p-8">
                <!-- Info Grid -->
                <div class="grid md:grid-cols-2 gap-12 mb-10">
                  <div class="space-y-4">
                    <div>
                      <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Shipping Address</p>
                      <p class="text-sm font-semibold">${shipping.name || 'User'}</p>
                      <p class="text-sm text-gray-500 leading-relaxed">${shipping.address || 'No address'}</p>
                      <p class="text-sm text-gray-500 mt-1">📞 ${shipping.phone || '—'}</p>
                    </div>
                  </div>
                  <div class="space-y-4">
                    <div class="flex justify-between items-start border-b border-gray-50 pb-4">
                      <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Payment</p>
                        <p class="text-sm font-medium">${shipping.method || 'Cash on Delivery'}</p>
                      </div>
                      <div class="text-right">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Delivery Estimate</p>
                        <p class="text-sm font-medium text-black">${deliveryDate}</p>
                      </div>
                    </div>
                    <div class="flex justify-between items-center pt-2">
                      <span class="text-sm font-bold">Total Amount</span>
                      <span class="text-2xl font-black">$${safeTotal}</span>
                    </div>
                  </div>
                </div>

                <!-- Item List -->
                <div>
                  <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-6">Items Purchased</p>
                  <div class="space-y-4">
                    ${items.map(item => {
            const safeItemName = escapeHtml(item.name);
            const safeItemImg = escapeHtml(item.image);
            const safeItemPrice = escapeHtml(item.unit_price || item.price);
            const safeItemQty = escapeHtml(item.quantity || item.qty);
            const itemTotal = (Number(safeItemPrice) * Number(safeItemQty)).toFixed(2);
            return `
                        <div class="flex items-center justify-between group">
                          <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl overflow-hidden bg-gray-50 border border-gray-100">
                              <img src="${safeItemImg}" class="w-full h-full object-cover" />
                            </div>
                            <div>
                              <p class="text-sm font-bold">${safeItemName}</p>
                              <p class="text-xs text-gray-400">Quantity: ${safeItemQty}</p>
                            </div>
                          </div>
                          <p class="text-sm font-bold text-gray-600">$${itemTotal}</p>
                        </div>
                      `;
          }).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        list.innerHTML = `<p class="text-center text-red-500">Error loading orders. Please try again.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>

  <!-- Animation Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('opacity-0', 'translate-y-10', 'scale-95');
              entry.target.classList.add('opacity-100', 'translate-y-0', 'scale-100');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll, section, .product-card').forEach(el => {
          el.classList.add('opacity-0', 'translate-y-10', 'scale-95', 'transition-all', 'duration-700', 'ease-out');
          observer.observe(el);
        });
      }
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.target !== '_blank' && link.origin === window.location.origin) {
        e.preventDefault();
        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-300');
        setTimeout(() => {
          window.location.href = link.href;
        }, 300);
      }
    });
  </script>
</body>


</html>
