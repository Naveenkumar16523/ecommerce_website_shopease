<!-- Top Banner -->
<div class="bg-black text-white text-center text-xs py-2 px-4 relative">
  Sign up and get 20% off to your first order.
  <a href="/signup" class="underline font-semibold ml-1">Sign Up Now</a>
</div>

<!-- Main Header -->
<header class="bg-white sticky top-0 z-50 shadow-sm">
  <div class="max-w-[1440px] mx-auto px-6 md:px-12 py-3 flex items-center justify-between gap-8 border-b border-gray-50">
    <div class="flex items-center gap-4 md:gap-6 text-[15px] font-semibold">
      <button onclick="toggleMobileMenu()" class="md:hidden p-1 text-gray-600 hover:text-black">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="/" class="text-2xl font-black hero-title mr-4 hidden sm:block">SHOP EASE</a>
      <div class="hidden lg:flex items-center gap-6">
        <a href="/" data-t="nav_home" class="{% if active_page == 'home' %}text-black{% else %}text-gray-800{% endif %} hover:text-black transition py-4 border-b-2 {% if active_page == 'home' %}border-black{% else %}border-transparent{% endif %}">Home</a>
        <div class="group relative py-4">
          <a href="/category/womens" data-t="nav_women" class="{% if active_page == 'womens' %}text-black{% else %}text-gray-800{% endif %} cursor-pointer">Women</a>
          <!-- Mega Menu content... -->
        </div>
        <div class="group relative py-4">
          <a href="/category/mens" data-t="nav_men" class="{% if active_page == 'mens' %}text-black{% else %}text-gray-800{% endif %} cursor-pointer">Men</a>
        </div>
        <div class="group relative py-4">
          <a href="/category/kids" data-t="nav_kids" class="{% if active_page == 'kids' %}text-black{% else %}text-gray-800{% endif %} cursor-pointer">Kids</a>
        </div>
        <a href="/brands" data-t="nav_brands" class="{% if active_page == 'brands' %}text-black{% else %}text-gray-800{% endif %} hover:text-black transition py-4">All Brands</a>
      </div>
    </div>

    <div class="flex-1 max-w-xl">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input type="text" data-t="search_placeholder" placeholder="Search for products, styles, brands..." 
          class="block w-full pl-10 pr-12 py-2.5 border border-gray-200 rounded bg-[#F5F7F9] text-sm focus:bg-white focus:ring-1 focus:ring-gray-300 outline-none transition-all">
      </div>
    </div>

    <div class="flex items-center gap-6">
      {% if current_user %}
      <a href="/profile" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-black group">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"/></svg>
        <span data-t="account">{{ current_user.name.split(' ')[0] }}</span>
      </a>
      {% else %}
      <a href="/login" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-black group">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span data-t="login">Login</span>
      </a>
      {% endif %}
      
      <a href="/wishlist" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-black group relative">
        <svg class="w-5 h-5 text-gray-400 group-hover:text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </a>
      <a href="/cart" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-black group relative">
        <div class="relative">
          <svg class="w-5 h-5 text-gray-400 group-hover:text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h13M10 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
          <span id="cartBadge" class="absolute -top-2 -right-2 bg-[#A52A4E] text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
        </div>
      </a>
    </div>
  </div>
</header>
