<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SHOP EASE{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    
    <!-- Fonts & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    

    
    <script src="https://cdn.tailwindcss.com"></script>

    {% block extra_head %}{% endblock %}

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* Custom Fonts & Base overrides */
    body { font-family: 'Outfit', sans-serif; background-color: #fafafa; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .brand-bar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; }
    
    /* Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: inline-flex; animation: marquee 35s linear infinite; }
    
    /* Smooth Transitions */
    .page-transition { animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Glassmorphism utility */
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>

</head>
<body class="bg-white">

    {% include 'partials/_nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <!-- Core Scripts -->
    <script src="/static/common.js?v=1.6"></script>
    <script>
        // Global utilities
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileSidebar');
            if (menu) menu.classList.toggle('-translate-x-full');
        }

        function viewProduct(element) {
            const id = element.getAttribute('data-id');
            const name = element.getAttribute('data-name') || 'product';
            const slug = element.getAttribute('data-slug') || `${slugify(name)}-${id}`;
            if (id) window.location.href = `/products/${id}/${slug}`;
        }
    </script>
    {% block extra_scripts %}{% endblock %}


  <!-- Animation Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('opacity-0', 'translate-y-10', 'scale-95');
              entry.target.classList.add('opacity-100', 'translate-y-0', 'scale-100');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll, section, .product-card').forEach(el => {
          el.classList.add('opacity-0', 'translate-y-10', 'scale-95', 'transition-all', 'duration-700', 'ease-out');
          observer.observe(el);
        });
      }
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.target !== '_blank' && link.origin === window.location.origin) {
        e.preventDefault();
        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-300');
        setTimeout(() => {
          window.location.href = link.href;
        }, 300);
      }
    });
  </script>
</body>

</html>
