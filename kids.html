  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>

  </script>
  <script src="/static/common.js?v=1.4" defer></script>

  <style>
    /* Custom Fonts & Base overrides */
    body { font-family: 'Outfit', sans-serif; background-color: #fafafa; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .brand-bar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; }
    
    /* Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: inline-flex; animation: marquee 35s linear infinite; }
    
    /* Smooth Transitions */
    .page-transition { animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Glassmorphism utility */
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>

</head>
<body class="bg-white text-black">

  
  <!-- Shared Navigation Partial -->

      document.getElementById('nav-placeholder').innerHTML = html;
      if (typeof updateAuthUI === 'function') updateAuthUI();

  </script>


  <div class="px-6 md:px-12 py-3 text-sm text-gray-400">

  <div class="flex gap-8 px-6 md:px-12 pb-20">

        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
      </div>

      
      <div class="filter-section">
        <ul class="space-y-4 text-gray-500 text-sm">
          <li class="flex items-center justify-between hover:text-black cursor-pointer">T-shirts <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
          <li class="flex items-center justify-between hover:text-black cursor-pointer">Shorts <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
          <li class="flex items-center justify-between hover:text-black cursor-pointer">Shirts <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
          <li class="flex items-center justify-between hover:text-black cursor-pointer">Hoodie <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
          <li class="flex items-center justify-between hover:text-black cursor-pointer">Jeans <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
        </ul>
      </div>

      
      <div class="filter-section">

      </div>

      
      <div class="filter-section">
        <h3 class="font-bold text-sm mb-4">Colors</h3>
        <div class="flex flex-wrap gap-2.5">
          <div class="color-dot bg-green-500"></div>
          <div class="color-dot bg-red-500"></div>
          <div class="color-dot bg-yellow-400"></div>
          <div class="color-dot bg-orange-500"></div>
          <div class="color-dot bg-blue-400"></div>
          <div class="color-dot bg-blue-700 active"></div>
          <div class="color-dot bg-purple-500"></div>
          <div class="color-dot bg-pink-400"></div>

          <button class="size-btn">Medium</button>

      <div class="filter-section border-0 mb-0 pb-0">

      <button class="w-full bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 py-3.5 rounded-full mt-6 font-bold text-sm hover:bg-gray-800 transition">Apply Filter</button>

    <main class="flex-1">

          <div class="hidden md:block">Sort by: <span class="text-black font-bold">Most Popular ▾</span></div>

      <div id="category-products-container" data-category="Kids" class="grid grid-cols-2 lg:grid-cols-3 gap-6">
        
      </div>
    </main>
  </div>


  <!-- Animation Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('opacity-0', 'translate-y-10', 'scale-95');
              entry.target.classList.add('opacity-100', 'translate-y-0', 'scale-100');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll, section, .product-card').forEach(el => {
          el.classList.add('opacity-0', 'translate-y-10', 'scale-95', 'transition-all', 'duration-700', 'ease-out');
          observer.observe(el);
        });
      }
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.target !== '_blank' && link.origin === window.location.origin) {
        e.preventDefault();
        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-300');
        setTimeout(() => {
          window.location.href = link.href;
        }, 300);
      }
    });
  </script>
</body>

</html>
