  <script>
    (function() {
      const savedTheme = localStorage.getItem('shopease-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* Custom Fonts & Base overrides */
    body { font-family: 'Outfit', sans-serif; background-color: #fafafa; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .brand-bar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; }
    
    /* Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: inline-flex; animation: marquee 35s linear infinite; }
    
    /* Smooth Transitions */
    .page-transition { animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { animation: fadeUp 0.8s ease-out forwards; }

    /* Glassmorphism utility */
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>

</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen overflow-hidden flex flex-col md:flex-row">

  <!-- Left Panel: Order Summary & Checkout -->
  <div class="md:w-2/5 bg-white border-r border-gray-100 relative overflow-y-auto flex-col p-8 lg:p-12 text-gray-900 scrollbar-hide z-10 hidden md:flex shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
    <!-- Floating Orbs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
      <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-gray-100 rounded-full blur-3xl animate-[spin_20s_linear_infinite]"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[30vw] h-[30vw] bg-yellow-50 rounded-full blur-3xl animate-[pulse_10s_ease-in-out_infinite]"></div>
    </div>

    <!-- Header -->
    <div class="relative z-10 mb-12 animate-fadeUp opacity-0" style="animation-delay: 0.1s;">
      <a href="/index.html" class="text-3xl font-black tracking-tight hero-title text-black hover:text-gray-500 transition-colors">SHOP EASE</a>
      <p class="text-xs text-gray-400 tracking-widest uppercase mt-2 font-bold">Your Cart</p>
    </div>

    <!-- Order Summary -->
    <div class="relative z-10 flex-1 flex flex-col animate-fadeUp opacity-0" style="animation-delay: 0.2s;">
      <h2 class="text-2xl font-bold mb-8 text-black tracking-tight">Order Summary</h2>
      
      <div class="space-y-4 text-sm mb-8 font-medium">
        <div class="flex justify-between text-gray-500 items-center p-3 rounded-xl hover:bg-gray-50 transition-colors">
          <span class="flex items-center gap-3"><span class="text-xl">🛍️</span> Subtotal</span>
          <span id="subtotal" class="text-gray-900 font-bold">$0</span>
        </div>
        <div class="flex justify-between text-red-500 items-center p-3 rounded-xl hover:bg-red-50 transition-colors">
          <span class="flex items-center gap-3"><span class="text-xl">🏷️</span> Discount (-20%)</span>
          <span id="discount" class="font-bold">-$0</span>
        </div>
        <div class="flex justify-between text-gray-500 items-center p-3 rounded-xl hover:bg-gray-50 transition-colors">
          <span class="flex items-center gap-3"><span class="text-xl">🚚</span> Delivery Fee</span>
          <span id="delivery-fee" class="text-gray-900 font-bold">$15</span>
        </div>
      </div>

      <hr class="border-gray-100 mb-8">

      <div class="flex justify-between font-bold text-2xl mb-8 p-4 bg-gray-50 rounded-2xl border border-gray-100">
        <span>Total</span>
        <span id="total" class="text-black">$0</span>
      </div>
      
      <div class="flex items-center gap-2 border-2 border-gray-100 rounded-2xl px-4 py-2 mb-8 bg-white focus-within:border-black transition-colors shadow-sm">
        <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M3 12l9 9 9-9-9-9-9 9z"/></svg>
        <input type="text" placeholder="Add promo code" class="promo-input flex-1 text-sm bg-transparent placeholder-gray-400 outline-none font-medium"/>
        <button class="bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:scale-105 transition-transform shadow-md">Apply</button>
      </div>
      
      <a href="/checkout.html" class="block mt-auto pb-8">
        <button class="checkout-btn w-full bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 py-5 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 border border-black/10">
          Go to Checkout <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M3 12h18"/></svg>
        </button>
      </a>
    </div>
  </div>

  <!-- Mobile Top Nav -->
  <div class="md:hidden bg-white border-b border-gray-100 text-black p-6 flex items-center justify-between z-20 relative">
    <a href="/index.html" class="text-2xl font-black tracking-tight hero-title">SHOP EASE</a>
    <a href="/checkout.html" class="text-xs font-bold text-white bg-black px-4 py-2 rounded-full shadow-md">Checkout</a>
  </div>
  
  <div class="md:hidden bg-gray-50 text-black px-6 py-4 border-b border-gray-100 flex justify-between items-center text-sm font-bold shadow-inner z-20 relative">
    <span>Total to Pay:</span>
    <span id="total-mobile" class="text-lg">$0</span>
  </div>

  <!-- Right Panel: Cart Items -->
  <div class="md:w-3/5 bg-gray-50 flex-1 relative overflow-y-auto scrollbar-hide">
    
    <!-- Desktop Navbar Inside Right Panel -->
    <nav class="hidden md:flex sticky top-0 glass border-b border-gray-100 p-6 items-center justify-between z-20">
      <div class="text-sm font-medium text-gray-500">
        <span class="text-black font-bold">Your Cart Items</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/index.html" class="text-sm font-bold text-gray-500 hover:text-black transition">Continue Shopping</a>
      </div>
    </nav>
    
    <div class="p-6 md:p-12 lg:p-16 max-w-3xl mx-auto pb-32 animate-fadeUp opacity-0" style="animation-delay: 0.3s;">
      <!-- Cart Container -->
      <div id="cart-container" class="space-y-4">
        <!-- JS will populate items here -->
      </div>
    </div>
  </div>
 
 <script>
const container = document.getElementById('cart-container');

function renderCart() {
  const cart = cartStore.get();
  console.log('Rendering Cart:', cart);
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center py-20 px-6 text-center bg-white rounded-3xl shadow-sm border border-gray-100">
        <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-6">
          <span class="text-4xl">🛒</span>
        </div>
        <h3 class="text-xl font-bold text-black mb-2">Your cart is empty</h3>
        <p class="text-gray-400 text-sm mb-8 max-w-xs mx-auto">Looks like you haven't added anything to your cart yet.</p>
        <a href="/index.html" class="inline-flex items-center justify-center bg-gradient-to-r from-slate-900 to-black text-white hover:scale-105 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 px-8 py-3.5 rounded-full text-sm font-semibold hover:bg-gray-800 transition shadow-lg shadow-black/5">
          Continue Shopping
        </a>
      </div>
    `;
    updateSummary();
    return;
  }

  cart.forEach((item) => {
    const pid = item.product_id;
    const imgUrl = item.image || 'https://via.placeholder.com/400?text=Product';
    
    container.innerHTML += `
      <div class="flex items-start gap-5 p-6 bg-white rounded-3xl shadow-sm border border-gray-100 group hover:shadow-md transition-shadow relative overflow-hidden" data-product-id="${pid}">
        <div class="absolute left-0 top-0 bottom-0 w-1 bg-yellow-400 transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
        <div class="w-24 h-24 md:w-28 md:h-28 rounded-2xl overflow-hidden bg-gray-50 flex-shrink-0">
          <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/400?text=Product'" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"/>
        </div>

        <div class="flex-1 flex flex-col justify-between h-full">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="font-bold text-base md:text-lg mb-1">${item.name}</h2>
              <p class="text-xs text-gray-400 uppercase tracking-widest font-bold">ID: ${pid}</p>
            </div>
            <button onclick="removeItem(${pid})" class="text-gray-300 hover:text-red-500 p-2 hover:bg-red-50 rounded-full transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg>
            </button>
          </div>

          <div class="flex justify-between items-center mt-4">
            <p class="font-black text-xl">$${item.price}</p>
            <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1 gap-4 shadow-sm">
              <button onclick="changeQty(${pid}, -1)" class="w-8 h-8 flex items-center justify-center text-lg font-bold hover:text-red-500 hover:bg-red-50 rounded-full transition-colors">−</button>
              <span class="text-sm font-bold min-w-[20px] text-center">${item.qty}</span>
              <button onclick="changeQty(${pid}, 1)" class="w-8 h-8 flex items-center justify-center text-lg font-bold hover:text-green-500 hover:bg-green-50 rounded-full transition-colors">+</button>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  updateSummary();
}

function changeQty(productId, delta) {
  const cart = cartStore.get();
  const item = cart.find(i => i.product_id === productId);
  if (item) {
    const newQty = item.qty + delta;
    if (newQty <= 0) {
      cartStore.remove(productId);
    } else {
      cartStore.updateQty(productId, newQty);
    }
  }
}

function removeItem(productId) {
  cartStore.remove(productId);
}

function updateSummary() {
  const subtotal = cartStore.subtotal;
  const discount = subtotal > 0 ? Math.round(subtotal * 0.2) : 0;
  const delivery = subtotal > 0 ? 15 : 0;
  const total = subtotal - discount + delivery;

  document.getElementById('subtotal').innerText = '$' + subtotal.toFixed(2);
  document.getElementById('discount').innerText = '-$' + discount.toFixed(2);
  document.getElementById('delivery-fee').innerText = '$' + delivery.toFixed(2);
  document.getElementById('total').innerText = '$' + total.toFixed(2);
  
  // Update mobile summary if it exists
  const mobileTotal = document.getElementById('total-mobile');
  if(mobileTotal) mobileTotal.innerText = '$' + total.toFixed(2);
}

// Listen for global cart updates
document.addEventListener('cart:updated', () => {
  renderCart();
});

document.addEventListener('DOMContentLoaded', () => {
  renderCart();
});
</script>

  <!-- Animation Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('opacity-0', 'translate-y-10', 'scale-95');
              entry.target.classList.add('opacity-100', 'translate-y-0', 'scale-100');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll, section, .product-card').forEach(el => {
          el.classList.add('opacity-0', 'translate-y-10', 'scale-95', 'transition-all', 'duration-700', 'ease-out');
          observer.observe(el);
        });
      }
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.target !== '_blank' && link.origin === window.location.origin) {
        e.preventDefault();
        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-300');
        setTimeout(() => {
          window.location.href = link.href;
        }, 300);
      }
    });
  </script>
</body>

</html>
