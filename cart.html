<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm h-16 flex items-center px-8 justify-between">
        <a href="index.html" class="text-2xl font-black">SHOP EASE</a>
        <a href="login.html" data-se="account-link" class="text-sm font-bold">Login</a>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <h1 class="text-4xl font-black mb-10 italic uppercase">Your Cart</h1>
        
        <div class="flex flex-col lg:flex-row gap-10">
            <!-- Items -->
            <div class="lg:w-2/3">
                <div id="cart-items-container" class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 space-y-6">
                    <!-- Items injected here -->
                </div>
            </div>

            <!-- Summary -->
            <div class="lg:w-1/3">
                <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 space-y-6">
                    <h3 class="text-xl font-bold">Order Summary</h3>
                    <div class="space-y-4 text-gray-500">
                        <div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal" class="text-black font-bold">$0</span></div>
                        <div class="flex justify-between"><span>Discount (20%)</span><span id="summary-discount" class="text-red-500 font-bold">-$0</span></div>
                        <div class="flex justify-between"><span>Delivery Fee</span><span id="summary-delivery" class="text-black font-bold">$15</span></div>
                        <hr class="border-gray-50">
                        <div class="flex justify-between text-xl text-black font-black"><span>Total</span><span id="summary-total">$0</span></div>
                    </div>
                    <a href="checkout.html" class="block w-full bg-black text-white text-center py-4 rounded-full font-bold hover:bg-gray-800 transition">Go to Checkout →</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const items = window.Cart.get();

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-gray-400 mb-6">Your cart is empty</p>
                        <a href="index.html" class="bg-black text-white px-8 py-3 rounded-full font-bold">Shop Now</a>
                    </div>
                `;
                updateSummary(0);
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="flex items-center gap-6 border-b border-gray-50 pb-6 last:border-0 last:pb-0" data-id="${item.product_id}">
                    <img src="${window.escapeHtml(item.image)}" 
                         loading="lazy" width="96" height="96"
                         class="w-24 h-24 object-cover rounded-xl bg-gray-100">
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-lg">${window.escapeHtml(item.name)}</h4>
                                <p class="text-xs text-gray-400 uppercase tracking-widest">Size: Large | Color: White</p>
                            </div>
                            <button onclick="window.Cart.remove(${item.product_id})" class="text-red-500 hover:text-red-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </button>
                        </div>
                        <div class="flex justify-between items-center mt-4">
                            <p class="font-black text-xl">$${item.price}</p>
                            <div class="flex items-center bg-gray-100 rounded-full px-3 py-1 space-x-4">
                                <button onclick="window.Cart.updateQty(${item.product_id}, ${item.qty - 1})" class="font-bold">-</button>
                                <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
                                <button onclick="window.Cart.updateQty(${item.product_id}, ${item.qty + 1})" class="font-bold">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            updateSummary(window.Cart.subtotal);
        }

        function updateSummary(subtotal) {
            const discount = Math.round(subtotal * 0.2);
            const delivery = subtotal > 0 ? 15 : 0;
            const total = subtotal - discount + delivery;

            document.getElementById('summary-subtotal').textContent = `$${subtotal}`;
            document.getElementById('summary-discount').textContent = `-$${discount}`;
            document.getElementById('summary-delivery').textContent = `$${delivery}`;
            document.getElementById('summary-total').textContent = `$${total}`;
        }

        window.addEventListener('DOMContentLoaded', renderCart);
        window.addEventListener('cart:updated', renderCart);
    </script>
</body>
</html>
