<!-- Top Banner -->
<div class="bg-black text-white text-center text-xs py-2 px-4 relative font-medium">
  Sign up and get 20% off to your first order.
  <a href="/signup" class="underline font-bold ml-1">Sign Up Now</a>
</div>

<!-- Main Header -->
<header class="bg-white sticky top-0 z-50 border-b border-gray-100">
  <div class="max-w-[1440px] mx-auto px-6 md:px-12 py-5 flex items-center justify-between gap-8">
    
    <div class="flex items-center gap-6">
      <button onclick="toggleMobileMenu()" class="md:hidden p-1 text-black">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="/" class="text-3xl font-black hero-title tracking-tighter">SHOP EASE</a>
      
      <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">
        <a href="/" class="hover:text-gray-500 transition">Shop</a>
        <a href="/on-sale" class="hover:text-gray-500 transition">On Sale</a>
        <a href="/new-arrivals" class="hover:text-gray-500 transition">New Arrivals</a>
        <a href="/brands" class="hover:text-gray-500 transition">Brands</a>
      </nav>
    </div>

    <!-- Search Bar -->
    <div class="flex-1 max-w-xl hidden md:block">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input type="text" placeholder="Search for products..." 
          class="block w-full pl-11 pr-4 py-3 bg-[#F0F0F0] rounded-full text-sm outline-none focus:ring-1 focus:ring-black/5 transition-all">
      </div>
    </div>

    <!-- Action Icons -->
    <div class="flex items-center gap-4">
      <button class="md:hidden text-black">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </button>
      
      <a href="/cart" class="relative group">
        <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h13M10 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-black text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
      </a>

      {% if current_user %}
      <a href="/profile" class="flex items-center gap-2">
        <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"/></svg>
      </a>
      {% else %}
      <a href="/login" class="flex items-center gap-2">
        <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </a>
      {% endif %}
    </div>

  </div>
</header>
