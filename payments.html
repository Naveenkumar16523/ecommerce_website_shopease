<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Methods – SHOP EASE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; }
  </style>
  

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="dns-prefetch" href="https://ecommerce-website-shopease.vercel.app">

    <!-- Modular JS stack -->
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="/static/js/config.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/wishlist.js"></script>
  <script src="/static/js/products.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-white text-black">
  <!-- Shared Navigation Partial -->
  <div id="nav-placeholder"></div>
  <script>
    fetch('nav.html').then(r => r.text()).then(html => {
      document.getElementById('nav-placeholder').innerHTML = html;
    });
  </script>
  <section class="py-20 px-6 md:px-12 max-w-3xl mx-auto">
    <h1 class="hero-title text-4xl font-black mb-8">SECURE PAYMENTS</h1>
    <div class="space-y-6">
      <p class="text-gray-500">We accept the following payment methods:</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="p-4 border border-gray-200 rounded-xl hover hover:bg-gray-100 text-center font-bold cursor-pointer">VISA</div>
        <div class="p-4 border border-gray-200 rounded-xl hover hover:bg-gray-100 text-center font-bold cursor-pointer">Mastercard</div>
        <div class="p-4 border border-gray-200 rounded-xl hover hover:bg-gray-100 text-center font-bold cursor-pointer">PayPal</div>
        <div class="p-4 border border-gray-200 rounded-xl hover hover:bg-gray-100 text-center font-bold cursor-pointer">G Pay</div>
      </div>
      <p class="text-sm text-gray-400 mt-10 italic">All transactions are encrypted and processed through our secure payment gateway partners.</p>
    </div>
  </section>
  <footer class="bg-[#F0EEED] py-10 text-center">
    <p class="text-xs text-gray-500">© 2025–2026 SHOP EASE. All Rights Reserved.</p>
  </footer>
</body>
</html>
