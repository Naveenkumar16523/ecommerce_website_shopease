<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="p-8 md:p-12">
            <div class="text-center mb-10">
                <a href="index.html" class="text-3xl font-black italic tracking-tighter">SHOP EASE</a>
                <p class="text-gray-400 mt-2 text-sm uppercase tracking-widest">Sign in to your account</p>
            </div>

            <!-- Rate Limit / Global Error Container -->
            <div id="api-error-container"></div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Email Address</label>
                    <input type="email" id="email" required placeholder="name@company.com" 
                           class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold uppercase text-gray-400">Password</label>
                        <button type="button" onclick="window.toast.warning('Disabled in demo mode')" class="text-xs font-bold text-black border-b border-black">Forgot?</button>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black transition">
                </div>

                <button type="submit" class="w-full bg-black text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg transform active:scale-95">Sign In</button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-500">
                Don't have an account? 
                <a href="signup.html" class="font-bold text-black border-b border-black">Create one</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await window.Auth.login(email, password);
            if (res.ok) {
                window.toast.success('Login successful!');
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || 'index.html';
                setTimeout(() => window.location.href = redirect, 1000);
            } else {
                window.toast.error(res.message);
            }
        });
    </script>

</body>
</html>
