<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SHOP EASE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="/static/js/config.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/wishlist.js"></script>
  <script src="/static/js/products.js"></script>
  <script src="/static/js/app.js" defer></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
    .brand-bar { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.15em; }
  </style>
</head>
<body class="bg-gray-50 text-black overflow-x-hidden">

  <section class="min-h-screen flex items-center justify-center px-4 py-12 w-full">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6">Login to SHOP EASE</h2>

      <!-- Inline Error Container -->
      <div id="api-error-container" class="hidden"></div>

      <form id="loginForm" class="space-y-4">
        <input id="loginEmail" type="email" placeholder="Email" required
          class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">

        <div class="relative">
          <input id="loginPassword" type="password" placeholder="Password" required
            class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black pr-10">
          <button type="button" onclick="togglePassword('loginPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>

        <div class="text-right">
          <button type="button" onclick="forgotPassword()" class="text-xs text-gray-500 hover:text-black underline">
            Forgot Password?
          </button>
        </div>

        <button type="submit"
          class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 disabled:bg-gray-400">
          Login
        </button>
      </form>

      <p class="text-sm text-center mt-4">
        Don't have an account?
        <a href="signup.html" class="text-black font-semibold underline">Sign Up</a>
      </p>
    </div>
  </section>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('svg');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.053 0 2.062.18 3 .512M7 7l10 10M9.88 9.88a3 3 0 104.24 4.24" />';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      }
    }

    function forgotPassword() {
      toast.warning("Forgot password functionality is disabled in demo mode.");
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerText = "Logging in...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          toast.success("Welcome back, " + data.user.name + "!");
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || 'index.html';
          setTimeout(() => { window.location.href = redirect; }, 1000);
        } else {
          toast.error("Login failed: " + data.message);
        }
      } catch (err) {
        toast.error("Server Error: " + err.message);
      } finally {
        submitBtn.innerText = "Login";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
