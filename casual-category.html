<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual Category | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <!-- Navigation (Same as Index) -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-2xl font-black text-black">SHOP EASE</a>
                <div class="flex-1 max-w-xs mx-8 relative hidden lg:block">
                    <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-gray-100 border-none rounded-full py-2 px-4 text-sm">
                </div>
                <div class="flex items-center space-x-6">
                    <a href="wishlist.html" class="relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-width="2"></path></svg>
                        <span id="wishlistBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                    </a>
                    <a href="cart.html" class="relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="2"></path></svg>
                        <span id="cartBadge" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                    </a>
                    <a href="login.html" data-se="account-link" class="text-sm font-bold">Login</a>
                    <button data-se="logout-btn" class="hidden text-sm text-red-500">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-4">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Filters Sidebar -->
            <aside class="w-full md:w-64 space-y-6">
                <div class="p-6 bg-white rounded-2xl border border-gray-100">
                    <h3 class="font-bold mb-4">Filters</h3>
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-2 uppercase tracking-widest text-[10px]">Price</p>
                            <input type="range" class="w-full accent-black">
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-2 uppercase tracking-widest text-[10px]">Colors</p>
                            <div class="flex flex-wrap gap-2">
                                <div class="w-6 h-6 rounded-full bg-red-500 border border-gray-200 cursor-pointer"></div>
                                <div class="w-6 h-6 rounded-full bg-blue-500 border border-gray-200 cursor-pointer"></div>
                                <div class="w-6 h-6 rounded-full bg-green-500 border border-gray-200 cursor-pointer"></div>
                                <div class="w-6 h-6 rounded-full bg-black border border-gray-200 cursor-pointer"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Product Grid -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-2xl font-black uppercase">Casual Style</h1>
                    <div class="flex items-center space-x-2 text-sm text-gray-500">
                        <span>Sort by:</span>
                        <select class="bg-transparent font-bold text-black border-none focus:ring-0">
                            <option>Most Popular</option>
                            <option>Newest</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                        </select>
                    </div>
                </div>
                
                <div id="category-products-container" data-category="casual" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Products loaded by products.js -->
                </div>
            </div>
        </div>
    </main>

</body>
</html>
