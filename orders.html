<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm h-16 flex items-center px-8 justify-between">
        <a href="index.html" class="text-2xl font-black">SHOP EASE</a>
        <div class="flex items-center space-x-6">
            <a href="profile.html" class="text-sm font-medium">My Profile</a>
            <button onclick="window.Auth.logout()" class="text-sm text-red-500 font-bold">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto py-12 px-4">
        <h1 class="text-4xl font-black uppercase mb-10 italic">Order History</h1>
        
        <div id="orders-container" class="space-y-8">
            <!-- Orders injected here -->
            <div class="text-center py-20 bg-white rounded-3xl border border-gray-100 shadow-sm">
                <p class="text-gray-400">Loading your orders...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadOrders() {
            const user = await window.Auth.requireAuth('orders.html');
            if (!user) return;

            const container = document.getElementById('orders-container');
            try {
                const orders = await window.API.getOrders();
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-white rounded-3xl border border-gray-100 shadow-sm">
                            <p class="text-gray-400 mb-6 text-lg">You haven't placed any orders yet.</p>
                            <a href="index.html" class="bg-black text-white px-8 py-3 rounded-full font-bold">Start Shopping</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const date = new Date(order.created_at).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    
                    const statusColors = {
                        'Pending': 'bg-yellow-100 text-yellow-700',
                        'Processing': 'bg-blue-100 text-blue-700',
                        'Shipped': 'bg-indigo-100 text-indigo-700',
                        'Delivered': 'bg-green-100 text-green-700',
                        'Cancelled': 'bg-red-100 text-red-700'
                    };

                    const statusClass = statusColors[order.status] || 'bg-gray-100 text-gray-700';

                    return `
                        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                            <div class="p-6 md:p-8 border-b border-gray-50 flex flex-col md:flex-row justify-between gap-4">
                                <div class="flex gap-8">
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest mb-1">Order ID</p>
                                        <p class="font-bold">#${order.order_id || order.id}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest mb-1">Date Placed</p>
                                        <p class="font-bold">${date}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest mb-1">Total Amount</p>
                                        <p class="font-bold">$${order.total}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest ${statusClass}">${order.status}</span>
                                    ${order.status === 'Pending' ? `
                                        <button onclick="cancelOrder('${order.order_id || order.id}')" class="text-xs font-bold text-red-500 border-b border-red-500">Cancel</button>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="p-6 md:p-8 bg-gray-50/50">
                                <ul class="space-y-4">
                                    ${order.items.map(item => `
                                        <li class="flex justify-between items-center text-sm">
                                            <span class="text-gray-600">${window.escapeHtml(item.name) || `Product #${item.product_id}`} <span class="font-bold text-black ml-2">× ${item.qty}</span></span>
                                            <span class="font-bold">$${(item.price * item.qty).toFixed(2)}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                container.innerHTML = `<p class="text-center text-red-500">Failed to load orders.</p>`;
            }
        }

        async function cancelOrder(id) {
            if (!confirm('Are you sure you want to cancel this order?')) return;
            
            try {
                const res = await window.apiRequest(`/orders/${id}/cancel`, { method: 'DELETE' });
                if (res && res.status === 200) {
                    window.toast.success('Order cancelled');
                    loadOrders();
                } else {
                    window.toast.error('Could not cancel order');
                }
            } catch (e) {
                window.toast.error('An error occurred');
            }
        }

        window.addEventListener('DOMContentLoaded', loadOrders);
    </script>

</body>
</html>
