<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="p-8 md:p-12">
            <div class="text-center mb-10">
                <a href="index.html" class="text-3xl font-black italic tracking-tighter">SHOP EASE</a>
                <p class="text-gray-400 mt-2 text-sm uppercase tracking-widest">Create your account</p>
            </div>

            <div id="api-error-container"></div>

            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe" 
                           class="w-full bg-gray-50 border-none rounded-xl py-3 px-5 focus:ring-2 focus:ring-black transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="name@company.com" 
                           class="w-full bg-gray-50 border-none rounded-xl py-3 px-5 focus:ring-2 focus:ring-black transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full bg-gray-50 border-none rounded-xl py-3 px-5 focus:ring-2 focus:ring-black transition">
                    <p class="text-[10px] text-gray-400 mt-1 uppercase">Min 8 chars, 1 Uppercase, 1 Number, 1 Special Char</p>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••" 
                           class="w-full bg-gray-50 border-none rounded-xl py-3 px-5 focus:ring-2 focus:ring-black transition">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-black text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg transform active:scale-95">Create Account</button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm text-gray-500">
                Already have an account? 
                <a href="login.html" class="font-bold text-black border-b border-black">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                return window.toast.error('Passwords do not match');
            }

            const res = await window.Auth.signup(name, email, password);
            if (res.ok) {
                window.toast.success('Account created! Please login.');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                window.toast.error(res.message);
            }
        });
    </script>

</body>
</html>
