<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - SHOP EASE</title>
  <script src="common.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script><script>if(window.tailwind){window.tailwind.config={theme:{extend:{colors:{clifford:\"#da373d\"}}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>

    <form id="signupForm" class="space-y-4">
      <input type="text" placeholder="Full Name" required
        class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">

      <input type="email" placeholder="Email" required
        class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">

      <div class="relative">
        <input id="signupPassword" type="password" placeholder="Password" required
          class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black pr-10">
        <button type="button" onclick="togglePassword('signupPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
      </div>

      <div class="relative">
        <input id="confirmPassword" type="password" placeholder="Confirm Password" required
          class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black pr-10">
        <button type="button" onclick="togglePassword('confirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
      </div>

      <button type="submit"
        class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">
        Sign Up
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      Already have an account?
      <a href="login.html" class="text-black font-semibold underline">Login</a>
    </p>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('svg');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.053 0 2.062.18 3 .512M7 7l10 10M9.88 9.88a3 3 0 104.24 4.24" />';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const fullName = document.querySelector('input[placeholder="Full Name"]').value;
      const email = document.querySelector('input[type="email"]').value;
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerText = "Creating Account...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: fullName, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert("Signup Successful! You can now log in.");
          window.location.href = "login.html";
        } else {
          alert("Signup failed: " + data.message);
        }
      } catch (err) {
        alert("Server Error: " + err.message);
      } finally {
        submitBtn.innerText = "Sign Up";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
