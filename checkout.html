<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm h-16 flex items-center px-8">
        <a href="index.html" class="text-2xl font-black">SHOP EASE</a>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <div class="flex flex-col lg:flex-row gap-12">
            
            <!-- Left: Checkout Form -->
            <div class="lg:w-2/3 space-y-8">
                <section class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-black uppercase mb-8 italic">Shipping Details</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Full Name</label>
                            <input type="text" id="ship-name" placeholder="John Doe" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Phone Number</label>
                            <input type="tel" id="ship-phone" placeholder="+1 (555) 000-0000" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Street Address</label>
                            <textarea id="ship-address" rows="3" placeholder="123 Fashion St, Appartment 4B" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-2">City</label>
                            <input type="text" id="ship-city" placeholder="New York" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Pincode / ZIP</label>
                            <input type="text" id="ship-pincode" placeholder="10001" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black">
                        </div>
                    </div>
                </section>

                <section class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-black uppercase mb-8 italic">Payment Method</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="cursor-pointer group">
                            <input type="radio" name="paymentMethod" value="Cash on Delivery" checked class="hidden peer">
                            <div class="border-2 border-gray-100 p-4 rounded-2xl text-center peer-checked:border-black peer-checked:bg-gray-50 transition">
                                <p class="font-bold">Cash on Delivery</p>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="paymentMethod" value="Card" class="hidden peer">
                            <div class="border-2 border-gray-100 p-4 rounded-2xl text-center peer-checked:border-black peer-checked:bg-gray-50 transition">
                                <p class="font-bold">Credit / Debit Card</p>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="paymentMethod" value="QR Code" class="hidden peer">
                            <div class="border-2 border-gray-100 p-4 rounded-2xl text-center peer-checked:border-black peer-checked:bg-gray-50 transition">
                                <p class="font-bold">QR Code Scan</p>
                            </div>
                        </label>
                    </div>
                </section>
            </div>

            <!-- Right: Order Summary -->
            <div class="lg:w-1/3">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 sticky top-24">
                    <h2 class="text-2xl font-black uppercase mb-8 italic">Summary</h2>
                    <div id="checkout-items" class="space-y-4 mb-8">
                        <!-- Items injected here -->
                    </div>
                    <div class="space-y-4 text-gray-500 text-sm">
                        <div class="flex justify-between"><span>Subtotal</span><span id="sub-val" class="text-black font-bold">$0</span></div>
                        <div class="flex justify-between"><span>Discount (20%)</span><span id="disc-val" class="text-red-500 font-bold">-$0</span></div>
                        <div class="flex justify-between"><span>Delivery</span><span class="text-black font-bold">$15</span></div>
                        <hr class="border-gray-50">
                        <div class="flex justify-between text-2xl font-black text-black"><span>Total</span><span id="total-val">$0</span></div>
                    </div>
                    <button onclick="submitOrder()" class="w-full bg-black text-white py-5 rounded-full font-bold mt-10 hover:bg-gray-800 transition shadow-xl transform hover:-translate-y-1">Place Order</button>
                    <p class="text-[10px] text-gray-400 text-center mt-4 uppercase tracking-tighter">By placing order, you agree to our Terms & Privacy</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function initCheckout() {
            // Guard
            const user = await window.Auth.requireAuth('checkout.html');
            if (!user) return;

            const items = window.Cart.get();
            if (items.length === 0) {
                window.toast.warning('Your cart is empty');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }

            renderSummary();
        }

        function renderSummary() {
            const container = document.getElementById('checkout-items');
            const items = window.Cart.get();
            
            container.innerHTML = items.map(item => `
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">${item.name} <span class="font-bold text-black">× ${item.qty}</span></span>
                    <span class="font-bold">$${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `).join('');

            const sub = window.Cart.subtotal;
            const disc = Math.round(sub * 0.2);
            const total = sub - disc + 15;

            document.getElementById('sub-val').textContent = `$${sub}`;
            document.getElementById('disc-val').textContent = `-$${disc}`;
            document.getElementById('total-val').textContent = `$${total}`;
        }

        async function submitOrder() {
            const fields = {
                name: document.getElementById('ship-name').value,
                phone: document.getElementById('ship-phone').value,
                address: document.getElementById('ship-address').value,
                city: document.getElementById('ship-city').value,
                pincode: document.getElementById('ship-pincode').value
            };

            if (Object.values(fields).some(v => !v.trim())) {
                return window.toast.error('Please fill in all shipping details');
            }

            const method = document.querySelector('input[name="paymentMethod"]:checked').value;
            const cartItems = window.Cart.get();
            const sub = window.Cart.subtotal;
            const disc = Math.round(sub * 0.2);
            const total = sub - disc + 15;

            const orderData = {
                items: cartItems.map(i => ({
                    product_id: i.product_id,
                    qty: i.qty,
                    price: i.price
                })),
                total: total,
                shipping: {
                    ...fields,
                    method: method
                }
            };

            try {
                const res = await window.API.placeOrder(orderData);
                if (res && (res.status === 'success' || res.order_id)) {
                    window.Cart.clear();
                    window.toast.success('Order placed successfully!');
                    setTimeout(() => window.location.href = 'orders.html', 1500);
                } else {
                    window.toast.error(res?.message || 'Failed to place order');
                }
            } catch (e) {
                window.toast.error('An error occurred. Please try again.');
            }
        }

        window.addEventListener('DOMContentLoaded', initCheckout);
    </script>
</body>
</html>
