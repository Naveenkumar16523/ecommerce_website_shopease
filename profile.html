<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm h-16 flex items-center px-8 justify-between">
        <a href="index.html" class="text-2xl font-black">SHOP EASE</a>
        <div class="flex items-center space-x-6">
            <a href="orders.html" class="text-sm font-medium">My Orders</a>
            <button onclick="window.Auth.logout()" class="text-sm text-red-500 font-bold">Logout</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-12 px-4">
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-black p-8 text-white">
                <h1 class="text-3xl font-black uppercase italic">My Profile</h1>
            </div>
            
            <div class="p-8 md:p-12 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Full Name</label>
                        <input type="text" id="prof-name" readonly class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 text-gray-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Email Address</label>
                        <input type="email" id="prof-email" readonly class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 text-gray-500 cursor-not-allowed">
                    </div>
                </div>

                <hr class="border-gray-50">

                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Phone Number</label>
                        <input type="tel" id="prof-phone" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Shipping Address</label>
                        <textarea id="prof-address" rows="4" class="w-full bg-gray-50 border-none rounded-xl py-4 px-6 focus:ring-2 focus:ring-black"></textarea>
                    </div>
                </div>

                <div class="pt-6">
                    <button onclick="saveProfile()" class="w-full md:w-auto bg-black text-white px-12 py-4 rounded-full font-bold hover:bg-gray-800 transition shadow-lg">Save Changes</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function initProfile() {
            const user = await window.Auth.requireAuth('profile.html');
            if (!user) return;

            document.getElementById('prof-name').value = user.name || '';
            document.getElementById('prof-email').value = user.email || '';
            document.getElementById('prof-phone').value = user.phone || '';
            document.getElementById('prof-address').value = user.address || '';
        }

        async function saveProfile() {
            const data = {
                phone: document.getElementById('prof-phone').value,
                address: document.getElementById('prof-address').value
            };

            const res = await window.API.updateProfile(data);
            if (res) {
                window.toast.success('Profile updated successfully');
                await window.Auth.updateUI(); // Refresh session
            } else {
                window.toast.error('Failed to update profile');
            }
        }

        window.addEventListener('DOMContentLoaded', initProfile);
    </script>

</body>
</html>
