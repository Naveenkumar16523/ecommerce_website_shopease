<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail | SHOP EASE</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/wishlist.js"></script>
    <script src="/static/js/products.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black">SHOP EASE</a>
            <div class="flex items-center space-x-6">
                <a href="cart.html" class="relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="2"></path></svg>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                </a>
                <a href="login.html" data-se="account-link" class="text-sm font-bold">Login</a>
                <button data-se="logout-btn" class="hidden text-sm text-red-500">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <div class="flex flex-col md:flex-row gap-12 bg-white p-8 rounded-3xl shadow-sm">
            <!-- Images -->
            <div class="md:w-1/2 flex gap-4">
                <div class="flex flex-col gap-4 w-24">
                    <img id="thumb1" src="" class="w-full aspect-square object-cover rounded-xl cursor-pointer border-2 border-transparent hover:border-black transition">
                </div>
                <div class="flex-1">
                    <img id="main-img" src="" class="w-full aspect-[4/5] object-cover rounded-2xl bg-gray-100">
                </div>
            </div>

            <!-- Details -->
            <div class="md:w-1/2 space-y-6">
                <h1 id="prod-name" class="text-4xl font-black uppercase tracking-tight">Loading...</h1>
                <div class="flex items-center space-x-2 text-yellow-400">
                    <span>★★★★☆</span>
                    <span class="text-gray-400 text-sm">(4.5/5)</span>
                </div>
                <p id="prod-price" class="text-3xl font-bold text-black">$0.00</p>
                <p class="text-gray-500 leading-relaxed">This premium product is crafted with the highest quality materials to ensure both style and durability. Perfect for any occasion, it seamlessly blends into your wardrobe.</p>
                
                <hr class="border-gray-100">

                <div class="space-y-4">
                    <p class="font-bold uppercase text-xs tracking-widest text-gray-400">Select Quantity</p>
                    <div class="flex items-center space-x-6">
                        <div class="flex items-center bg-gray-100 rounded-full px-4 py-2 space-x-4">
                            <button onclick="updatePageQty(-1)" class="text-xl font-bold">-</button>
                            <input type="text" id="page-qty" value="1" readonly class="bg-transparent w-8 text-center font-bold">
                            <button onclick="updatePageQty(1)" class="text-xl font-bold">+</button>
                        </div>
                        <button onclick="addCurrentToCart()" class="flex-1 bg-black text-white py-4 rounded-full font-bold hover:bg-gray-800 transition shadow-lg">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentProduct = null;

        async function initProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) return window.location.href = 'index.html';

            currentProduct = await window.API.getProduct(id);
            if (currentProduct) {
                window.Products.renderDetail(currentProduct);
            }
        }

        function updatePageQty(change) {
            const input = document.getElementById('page-qty');
            let val = parseInt(input.value) + change;
            input.value = Math.max(1, Math.min(99, val));
        }

        function addCurrentToCart() {
            if (!currentProduct) return;
            const qty = parseInt(document.getElementById('page-qty').value);
            window.Cart.add(currentProduct, qty);
        }

        window.addEventListener('DOMContentLoaded', initProduct);
    </script>

</body>
</html>
